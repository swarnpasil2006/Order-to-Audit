<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PASIL Foods · Order-to-Audit ERP</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-sub: #f1f5f9;
  --card-border: #e2e8f0;
  --tx-main: #0f172a;
  --tx-muted: #64748b;
  --tx-sub: #475569;
  --primary: #9a3412;
  --primary-hover: #7c2d12;
  --primary-light: #ffedd5;
  --primary-tx: #ffffff;
  --accent: #d97706;
  --success: #15803d;
  --success-bg: #dcfce7;
  --danger: #b91c1c;
  --danger-bg: #fee2e2;
  --warning: #b45309;
  --warning-bg: #fef3c7;
  --info: #0369a1;
  --info-bg: #e0f2fe;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  --radius: 10px;
}

[data-theme="dark"] {
  --bg: #0b1120;
  --surface: #1e293b;
  --surface-sub: #0f172a;
  --card-border: #334155;
  --tx-main: #f8fafc;
  --tx-muted: #94a3b8;
  --tx-sub: #cbd5e1;
  --primary: #ea580c;
  --primary-hover: #f97316;
  --primary-light: #431407;
  --primary-tx: #ffffff;
  --accent: #f59e0b;
  --success: #22c55e;
  --success-bg: #052e16;
  --danger: #ef4444;
  --danger-bg: #450a0a;
  --warning: #f59e0b;
  --warning-bg: #451a03;
  --info: #38bdf8;
  --info-bg: #082f49;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background-color: var(--bg);
  color: var(--tx-main);
  line-height: 1.5;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* App Header */
.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--card-border);
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: var(--shadow-sm);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  gap: 16px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-logo {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, #9a3412, #ea580c);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 800;
  font-size: 20px;
  box-shadow: 0 2px 8px rgba(154, 52, 18, 0.3);
}
.brand-info h1 {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.2;
  color: var(--tx-main);
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-info .tagline {
  font-size: 11.5px;
  color: var(--tx-muted);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* Navigation Tabs */
.nav-bar {
  display: flex;
  gap: 4px;
  padding: 0 24px;
  overflow-x: auto;
  border-top: 1px solid var(--card-border);
  background: var(--surface);
}
.nav-tab {
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--tx-muted);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.nav-tab:hover {
  color: var(--tx-main);
  background: var(--surface-sub);
}
.nav-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

/* Main Container */
.main-content {
  max-width: 1240px;
  margin: 0 auto;
  padding: 20px 24px 80px;
}

/* Hero Banner */
.hero {
  background: linear-gradient(135deg, #7c2d12 0%, #c2410c 50%, #d97706 100%);
  color: #ffffff;
  border-radius: 16px;
  padding: 24px 28px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.hero-content {
  position: relative;
  z-index: 2;
  max-width: 720px;
}
.hero h2 {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.hero p {
  font-size: 13.5px;
  opacity: 0.92;
  margin-bottom: 16px;
  line-height: 1.5;
}
.hero-btns {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.hero-deco {
  position: absolute;
  right: -20px;
  bottom: -40px;
  width: 220px;
  height: 220px;
  opacity: 0.15;
  pointer-events: none;
}

/* Grid & Cards */
.grid-4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
@media (max-width: 640px) {
  .grid-2 { grid-template-columns: 1fr; }
}

.card {
  background: var(--surface);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}
.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--tx-main);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-subtitle {
  font-size: 12px;
  color: var(--tx-muted);
  font-weight: normal;
}

/* KPI Widgets */
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.kpi-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--tx-muted);
  margin-bottom: 6px;
}
.kpi-val {
  font-size: 24px;
  font-weight: 800;
  color: var(--tx-main);
  line-height: 1.2;
}
.kpi-sub {
  font-size: 11.5px;
  margin-top: 6px;
  color: var(--tx-muted);
}

/* Buttons */
button {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.btn-primary {
  background: var(--primary);
  color: var(--primary-tx);
}
.btn-primary:hover {
  background: var(--primary-hover);
}
.btn-secondary {
  background: var(--surface);
  color: var(--tx-main);
  border-color: var(--card-border);
}
.btn-secondary:hover {
  background: var(--surface-sub);
}
.btn-white {
  background: #ffffff;
  color: #7c2d12;
}
.btn-white:hover {
  background: #f8fafc;
}
.btn-ghost-white {
  background: rgba(255, 255, 255, 0.18);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.4);
}
.btn-ghost-white:hover {
  background: rgba(255, 255, 255, 0.28);
}
.btn-sm {
  padding: 5px 10px;
  font-size: 12px;
  border-radius: 6px;
}
.btn-danger {
  background: var(--danger-bg);
  color: var(--danger);
  border-color: rgba(185, 28, 28, 0.2);
}
.btn-danger:hover {
  background: #fca5a5;
}
.btn-success {
  background: var(--success);
  color: #fff;
}
.btn-success:hover {
  background: #166534;
}

/* Forms & Inputs */
.form-group {
  margin-bottom: 12px;
}
.form-label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--tx-sub);
}
input, select, textarea {
  width: 100%;
  font-family: inherit;
  font-size: 13.5px;
  padding: 8px 12px;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--tx-main);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(154, 52, 18, 0.15);
}
.input-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.input-row > * {
  flex: 1 1 140px;
}

/* Badges & Pills */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.badge-ok { background: var(--success-bg); color: var(--success); }
.badge-bad { background: var(--danger-bg); color: var(--danger); }
.badge-warn { background: var(--warning-bg); color: var(--warning); }
.badge-info { background: var(--info-bg); color: var(--info); }
.badge-neutral { background: var(--surface-sub); color: var(--tx-muted); border: 1px solid var(--card-border); }

/* Tables */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  background: var(--surface);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}
th {
  background: var(--surface-sub);
  color: var(--tx-muted);
  font-weight: 700;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 10px 14px;
  border-bottom: 1px solid var(--card-border);
  white-space: nowrap;
}
td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--card-border);
  color: var(--tx-main);
  white-space: nowrap;
}
tr:last-child td {
  border-bottom: none;
}
tr:hover td {
  background: var(--surface-sub);
}
.text-right { text-align: right; }
.text-center { text-align: center; }

/* Progress & Stock Bars */
.stock-bar-row {
  display: grid;
  grid-template-columns: 140px 1fr 110px;
  align-items: center;
  gap: 12px;
  margin: 10px 0;
  font-size: 12.5px;
}
.stock-bar-track {
  height: 9px;
  background: var(--card-border);
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}
.stock-bar-fill {
  height: 100%;
  border-radius: 6px;
  background: linear-gradient(90deg, #ea580c, #9a3412);
  transition: width 0.3s ease;
}
.stock-bar-fill.low {
  background: var(--danger);
}

/* Toast Messages */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 420px;
}
.toast {
  background: var(--surface);
  color: var(--tx-main);
  border-left: 4px solid var(--primary);
  border-radius: 8px;
  padding: 12px 16px;
  box-shadow: var(--shadow-lg);
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-top: 1px solid var(--card-border);
  border-right: 1px solid var(--card-border);
  border-bottom: 1px solid var(--card-border);
  animation: slideIn 0.2s ease-out;
}
@keyframes slideIn {
  from { transform: translateY(10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.toast-success { border-left-color: var(--success); }
.toast-error { border-left-color: var(--danger); }
.toast-warning { border-left-color: var(--warning); }

/* Modal Styles */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  backdrop-filter: blur(2px);
}
.modal-box {
  background: var(--surface);
  border-radius: 12px;
  max-width: 650px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h3 {
  font-size: 16px;
  font-weight: 700;
}
.modal-body {
  padding: 20px;
}
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--card-border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  background: var(--surface-sub);
}

/* Printable GST Invoice */
.invoice-container {
  background: #ffffff;
  color: #111827;
  padding: 30px;
  max-width: 800px;
  margin: 0 auto;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 12.5px;
  line-height: 1.4;
  box-shadow: var(--shadow-sm);
}
.inv-header {
  display: flex;
  justify-content: space-between;
  border-bottom: 2px solid #9a3412;
  padding-bottom: 12px;
  margin-bottom: 16px;
}
.inv-meta {
  text-align: right;
}
.inv-parties {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  border-bottom: 1px solid #e5e7eb;
  padding-bottom: 16px;
  margin-bottom: 16px;
}
.inv-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 16px;
}
.inv-table th {
  background: #f3f4f6;
  border: 1px solid #d1d5db;
  padding: 8px;
  font-size: 11.5px;
  color: #374151;
}
.inv-table td {
  border: 1px solid #d1d5db;
  padding: 8px;
  font-size: 12px;
}
.inv-totals {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 20px;
}
.inv-totals table {
  width: 280px;
}
.inv-totals td {
  padding: 5px 8px;
  border: 1px solid #e5e7eb;
}
.inv-signatures {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
  margin-top: 30px;
  align-items: end;
}

@media print {
  body { background: #fff !important; color: #000 !important; }
  .app-header, .hero, .nav-bar, .header-actions, .noprint, .toast-container, .modal-footer {
    display: none !important;
  }
  .main-content { padding: 0 !important; max-width: 100% !important; margin: 0 !important; }
  .invoice-container {
    border: none !important;
    padding: 0 !important;
    max-width: 100% !important;
    box-shadow: none !important;
  }
}
</style>
</head>

function updateConnectionBadge(online) {
  const badge = document.getElementById('serverBadge');
  if (!badge) return;
  if (online) {
    badge.className = 'badge badge-ok';
    badge.textContent = '🟢 Server Online (Live Sync)';
    badge.title = 'Real-time REST API synchronization active with backend server';
  } else {
    badge.className = 'badge badge-neutral';
    badge.textContent = '🟡 Offline Mode (Local)';
    badge.title = 'Running standalone via browser storage';
  }
}

function saveState() {
  try {
    localStorage.setItem('o2a_v2', JSON.stringify(S));
  } catch (e) {
    console.error('Failed to save to local storage', e);
  }
  if (window.isServerOnline) {
    fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(S)
    }).catch(() => {
      window.isServerOnline = false;
      updateConnectionBadge(false);
    });
  }
}

async function loadState() {
  try {
    const raw = localStorage.getItem('o2a_v2');
    if (raw) {
      S = JSON.parse(raw);
    }
  } catch (e) {}

  if (!S) resetState();
  if (!S.products) S.products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
  if (!S.customers) S.customers = JSON.parse(JSON.stringify(DEFAULT_CUSTOMERS));
  if (!S.vendors) S.vendors = JSON.parse(JSON.stringify(DEFAULT_VENDORS));

  // Check live backend server
  try {
    if (typeof fetch === 'function') {
      const res = await fetch('/api/state', { cache: 'no-cache' });
      if (res.ok) {
        const data = await res.json();
        if (data && data.data && data.data.led) {
          S = data.data;
          window.isServerOnline = true;
          updateConnectionBadge(true);
          renderApp();
          return;
        }
      }
    }
  } catch (err) {}

  window.isServerOnline = false;
  updateConnectionBadge(false);
}

// Official GSTR-1 GSTN JSON Exporter
function exportGSTR1JSON() {
  const b2bInvoices = S.inv.filter(i => !i.cn);
  const b2bGrouped = {};
  b2bInvoices.forEach(i => {
    const cust = getCustomer(i.c);
    const gstin = cust.gstin && cust.gstin !== 'UNREGISTERED' ? cust.gstin : '33AAAAA1234A1Z5';
    if (!b2bGrouped[gstin]) {
      b2bGrouped[gstin] = { ctin: gstin, inv: [] };
    }
    const isInter = i.ig > 0;
    b2bGrouped[gstin].inv.push({
      inum: i.no,
      idt: (i.date || new Date().toISOString().slice(0, 10)).split('-').reverse().join('-'),
      val: +(i.tot / 100).toFixed(2),
      pos: cust.stateCode || '33',
      rchrg: 'N',
      inv_typ: 'R',
      itms: [{
        num: 1,
        itm_det: {
          txval: +(i.tx / 100).toFixed(2),
          rt: 5,
          iamt: +(i.ig / 100).toFixed(2),
          camt: +(i.cg / 100).toFixed(2),
          samt: +(i.sg / 100).toFixed(2),
          csamt: 0
        }
      }]
    });
  });

  const gstr1Payload = {
    gstin: COMPANY.gstin,
    fp: '112026',
    cur_gt: 0,
    gt: 0,
    b2b: Object.values(b2bGrouped)
  };

  const blob = new Blob([JSON.stringify(gstr1Payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `GSTR1_${COMPANY.gstin}_112026.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('GSTR-1 JSON generated in official GSTN offline format!', 'success');
}

// Material Requirements Planning (MRP) Engine
function renderMRPCalculator(targetQty = 400) {
  const prod = S.products.mur;
  const batches = targetQty / prod.standardYield;
  const items = Object.keys(prod.bom).map(it => {
    const planned = prod.bom[it] * batches;
    const currentStock = bal(it) / 1000;
    const deficit = Math.max(0, +(planned - currentStock).toFixed(3));
    let preferredVendor = 'V1';
    if (it === 'oil') preferredVendor = 'V2';
    if (it === 'pouch' || it === 'carton') preferredVendor = 'V3';
    return { it, name: RAW_ITEMS[it]?.name || it, unit: RAW_ITEMS[it]?.unit || 'u', planned, currentStock, deficit, vendor: preferredVendor };
  });

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Raw Material</th>
            <th class="text-right">BOM Standard</th>
            <th class="text-right">Required for ${targetQty} Pkts</th>
            <th class="text-right">Current Stores Stock</th>
            <th class="text-right">Deficit / Shortage</th>
            <th>Procurement Action</th>
          </tr>
        </thead>
        <tbody>
          ${items.map(m => `
            <tr>
              <td><strong>${m.name}</strong></td>
              <td class="text-right">${prod.bom[m.it]} ${m.unit}</td>
              <td class="text-right"><strong>${m.planned.toFixed(2)}</strong> ${m.unit}</td>
              <td class="text-right">${m.currentStock.toFixed(2)} ${m.unit}</td>
              <td class="text-right" style="font-weight:700;color:${m.deficit > 0 ? 'var(--danger)' : 'var(--success)'}">
                ${m.deficit > 0 ? '-' + m.deficit.toFixed(2) + ' ' + m.unit : '✓ Stock Covered'}
              </td>
              <td>
                ${m.deficit > 0 ? `
                  <button class="btn-primary btn-sm" onclick="showPOModal('${m.it}', ${m.deficit}, '${m.vendor}')">📜 Create PO (${S.vendors[m.vendor]?.name || m.vendor})</button>
                ` : '<span class="badge badge-ok">Ready for Run</span>'}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// Tally-Compatible XML Exporter (Stretch Goal)
function exportTallyXML() {
  let xml = `<?xml version="1.0" encoding="utf-8"?>\n<ENVELOPE>\n  <HEADER>\n    <TALLYREQUEST>Import Data</TALLYREQUEST>\n  </HEADER>\n  <BODY>\n    <IMPORTDATA>\n      <REQUESTDESC>\n        <REPORTNAME>Vouchers</REPORTNAME>\n      </REQUESTDESC>\n      <REQUESTDATA>\n`;

  S.inv.filter(i => !i.cn).forEach(i => {
    const cust = getCustomer(i.c);
    const dateFormatted = (i.date || '2026-11-20').replace(/-/g, '');
    xml += `        <TALLYMESSAGE xmlns:UDF="TallyUDF">\n          <VOUCHER VCHTYPE="Sales" ACTION="Create">\n            <DATE>${dateFormatted}</DATE>\n            <VOUCHERNUMBER>${i.no}</VOUCHERNUMBER>\n            <PARTYLEDGERNAME>${cust.name}</PARTYLEDGERNAME>\n            <NARRATION>Order #${i.oid} - Murukku 200g (${i.q} pkts)</NARRATION>\n            <ALLLEDGERENTRIES.LIST>\n              <LEDGERNAME>${cust.name}</LEDGERNAME>\n              <ISDEEMEDPOSITIVE>Yes</ISDEEMEDPOSITIVE>\n              <AMOUNT>-${(i.tot / 100).toFixed(2)}</AMOUNT>\n            </ALLLEDGERENTRIES.LIST>\n            <ALLLEDGERENTRIES.LIST>\n              <LEDGERNAME>Sales Account</LEDGERNAME>\n              <ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE>\n              <AMOUNT>${(i.tx / 100).toFixed(2)}</AMOUNT>\n            </ALLLEDGERENTRIES.LIST>\n`;
    if (i.cg > 0) {
      xml += `            <ALLLEDGERENTRIES.LIST>\n              <LEDGERNAME>CGST @ 2.5%</LEDGERNAME>\n              <ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE>\n              <AMOUNT>${(i.cg / 100).toFixed(2)}</AMOUNT>\n            </ALLLEDGERENTRIES.LIST>\n            <ALLLEDGERENTRIES.LIST>\n              <LEDGERNAME>SGST @ 2.5%</LEDGERNAME>\n              <ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE>\n              <AMOUNT>${(i.sg / 100).toFixed(2)}</AMOUNT>\n            </ALLLEDGERENTRIES.LIST>\n`;
    } else if (i.ig > 0) {
      xml += `            <ALLLEDGERENTRIES.LIST>\n              <LEDGERNAME>IGST @ 5.0%</LEDGERNAME>\n              <ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE>\n              <AMOUNT>${(i.ig / 100).toFixed(2)}</AMOUNT>\n            </ALLLEDGERENTRIES.LIST>\n`;
    }
    xml += `          </VOUCHER>\n        </TALLYMESSAGE>\n`;
  });

  xml += `      </REQUESTDATA>\n    </IMPORTDATA>\n  </BODY>\n</ENVELOPE>`;

  const blob = new Blob([xml], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Tally_Sales_Vouchers_${COMPANY.gstin}.xml`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Tally XML daybook vouchers exported successfully!', 'success');
}

// Business Logic Functions
function purchaseItem(it, q, rate, vendor = 'V1') {
  if (!(q > 0 && rate >= 0)) throw new Error('Please enter a valid positive quantity and rate');
  const itemName = RAW_ITEMS[it] ? RAW_ITEMS[it].name : it;
  mv(it, Math.round(q * 1000), Math.round(q * rate * 100), 'Purchase #' + (S.seq++), `From ${S.vendors[vendor]?.name || vendor}`);
  saveState();
  toast(`Purchased ${q} ${RAW_ITEMS[it]?.unit || 'units'} of ${itemName} at ₹${rate}/unit`, 'success');
}

function runProduction(prodId, iss, good) {
  const prod = getProduct(prodId);
  const bom = prod.bom;
  for (const it in bom) {
    const required = Math.round((iss[it] || 0) * 1000);
    if (required > bal(it)) {
      const itName = RAW_ITEMS[it]?.name || it;
      throw new Error(`Insufficient stock for ${itName}! Available: ${n3(bal(it))}, Required: ${n3(required)}`);
    }
  }

  const runId = S.runs.length + 1;
  const src = 'Run #' + runId;
  let mat = 0;
  const lines = [];

  for (const it in bom) {
    const p = Math.round(bom[it] * 1000);
    const a = Math.round((iss[it] || 0) * 1000);
    let valIssued = 0;
    if (a > 0) {
      const unitAvgCost = avg(it);
      valIssued = Math.round(unitAvgCost * a);
      mv(it, -a, -valIssued, src, `Issued to Batch #${runId}`);
      mat += valIssued;
    }
    const v = (a - p) / p;
    lines.push({ it, p, a, v, flag: Math.abs(v) > TOL + 1e-9 });
  }

  mv(prodId, good * 1000, mat, src, `Good output (${good} packets)`);

  const run = {
    id: runId,
    prodId,
    exp: prod.standardYield,
    good,
    mat,
    oh: 0,
    lines,
    yv: (good - prod.standardYield) / prod.standardYield,
    date: new Date().toISOString().slice(0, 10),
    batchNo: `BAT-${new Date().getFullYear()}-${String(runId).padStart(3, '0')}`
  };

  S.runs.push(run);
  saveState();
  toast(`Production Run #${runId} logged successfully. Output: ${good} packets.`, 'success');
  return run;
}

const cpp = r => r.good > 0 ? (r.mat + r.oh) / r.good / 100 : 0;

function addOverhead(runId, label, rs) {
  const r = S.runs.find(x => x.id === runId);
  if (!r) throw new Error('Run not found');
  const p = Math.round(rs * 100);
  r.oh += p;
  mv(r.prodId || 'mur', 0, p, 'Run #' + runId, 'Overhead: ' + label);
  saveState();
  toast(`Added overhead ₹${rs} (${label}) to Run #${runId}`, 'success');
}

function submitOrder(customerId, salesman, q, prodId = 'mur') {
  if (!(q > 0)) throw new Error('Enter a valid order quantity');
  const orderId = S.ord++;
  S.orders.push({
    id: orderId,
    c: customerId,
    sales: salesman || 'Default Salesman',
    prodId,
    q,
    st: 'submitted',
    date: new Date().toISOString().slice(0, 10)
  });
  saveState();
  toast(`Order #${orderId} created for ${getCustomer(customerId).name} (${q} pkts)`, 'success');
}

function approveOrder(id) {
  const o = S.orders.find(x => x.id === id);
  if (!o) throw new Error('Order not found');
  const availableQty = avail(o.prodId || 'mur');
  const shortage = o.q - availableQty;
  if (shortage > 0) {
    o.st = 'on_hold';
    o.short = shortage;
    saveState();
    toast(`Order #${id} placed ON HOLD: Short by ${shortage} packets`, 'warning');
    return shortage;
  }
  o.st = 'approved';
  delete o.short;
  saveState();
  toast(`Order #${id} approved! Stock reserved for dispatch.`, 'success');
  return 0;
}

function raiseInvoice(id) {
  const o = S.orders.find(x => x.id === id);
  if (!o) throw new Error('Order not found');
  const prod = getProduct(o.prodId || 'mur');
  const cust = getCustomer(o.c);

  const tx = o.q * prod.price;
  const tax = Math.round(tx * prod.gstRate / 100);
  const isInterstate = cust.stateCode !== COMPANY.stateCode;

  const cg = isInterstate ? 0 : Math.floor(tax / 2);
  const sg = isInterstate ? 0 : tax - cg;
  const ig = isInterstate ? tax : 0;
  const invSeq = S.inv.length + 1;
  const invNo = `INV/2026-27/${String(invSeq).padStart(4, '0')}`;

  const invItem = {
    no: invNo,
    oid: id,
    c: o.c,
    prodId: o.prodId || 'mur',
    q: o.q,
    price: prod.price,
    tx,
    cg,
    sg,
    ig,
    tot: tx + tax,
    disp: false,
    date: new Date().toISOString().slice(0, 10),
    irn: 'IRN-' + Math.random().toString(36).substring(2, 10).toUpperCase()
  };

  S.inv.push(invItem);
  o.st = 'invoiced';
  saveState();
  toast(`GST Invoice ${invNo} raised for ${inr(invItem.tot)}`, 'success');
  return invItem;
}

function dispatchInvoice(no) {
  const i = S.inv.find(x => x.no === no);
  if (!i) throw new Error('Invoice not found');
  const currentMurStock = Math.floor(bal(i.prodId || 'mur') / 1000);
  if (i.q > currentMurStock) throw new Error(`Not enough finished goods! Available: ${currentMurStock}, Required: ${i.q}`);

  const unitAvg = avg(i.prodId || 'mur');
  const costValue = Math.round(unitAvg * i.q * 1000);
  mv(i.prodId || 'mur', -(i.q * 1000), -costValue, no, `Dispatched against ${no}`);
  i.disp = true;
  const order = S.orders.find(o => o.id === i.oid);
  if (order) order.st = 'dispatched';
  saveState();
  toast(`Invoice ${no} successfully dispatched! Stock deducted.`, 'success');
}

function issueCreditNote(no) {
  const i = S.inv.find(x => x.no === no);
  if (!i) throw new Error('Invoice not found');
  if (i.cn) throw new Error('Credit Note already issued for this invoice');

  // Reverse stock ledger entries associated with this invoice dispatch
  S.led.filter(m => m.src === no).forEach(m => {
    mv(m.it, -m.q, -m.val, 'Credit Note for ' + no, 'Sales return stock replenishment');
  });

  const cnCount = S.inv.filter(x => x.cn).length + 1;
  i.cn = `CN/2026-27/${String(cnCount).padStart(4, '0')}`;
  const order = S.orders.find(o => o.id === i.oid);
  if (order) order.st = 'cancelled';
  saveState();
  toast(`Credit Note ${i.cn} issued for ${no}. Stock restored.`, 'warning');
}

function recordPayment(c, rs, mode = 'Bank Transfer', ref = '') {
  if (!(rs > 0)) throw new Error('Enter a valid payment amount');
  const payment = {
    id: S.pay.length + 1,
    c,
    a: Math.round(rs * 100),
    date: new Date().toISOString().slice(0, 10),
    mode,
    ref: ref || 'NEFT-' + Math.random().toString(36).substring(2, 8).toUpperCase()
  };
  S.pay.push(payment);
  saveState();
  toast(`Payment of ₹${rs} received from ${getCustomer(c).name}`, 'success');
}

// 9-Step Section 5 Benchmark Execution
function runBenchmark() {
  resetState();
  const checks = [];
  const logCheck = (label, expected, actual) => {
    const passed = String(expected) === String(actual);
    checks.push({ label, expected, actual, passed });
  };

  // Step 1: Purchase 60 kg flour @ ₹45
  purchaseItem('flour', 60, 45, 'V1');

  // Step 2: Production Run #1
  const r = runProduction('mur', { flour: 40, oil: 10.5, spice: 1.2, pouch: 194, carton: 9 }, 188);
  logCheck('Finished goods after run', 238, n3(bal('mur')));

  // Step 3: Order 1 by Retailer A (150 pkts) -> Approve -> Invoice -> Dispatch
  submitOrder('A', 'Salesman A', 150, 'mur');
  approveOrder(1);
  const inv1 = raiseInvoice(1);
  dispatchInvoice(inv1.no);
  logCheck('Finished goods after dispatch', 88, n3(bal('mur')));

  // Step 4: Order 2 by Distributor B (120 pkts) -> Approve -> Shortage Check
  submitOrder('B', 'Salesman B', 120, 'mur');
  const shortage = approveOrder(2);
  logCheck('Distributor B shortage (packets)', 32, shortage);

  // Step 5: Payment from Retailer A (₹4,000)
  recordPayment('A', 4000, 'NEFT');

  // Step 6: Overheads on Run 1
  addOverhead(1, 'Labour', 1200);
  addOverhead(1, 'Gas & power', 600);

  // Verification Checks
  logCheck('Flour closing (kg)', 120, n3(bal('flour')));
  logCheck('Oil closing (L)', 19.5, n3(bal('oil')));
  logCheck('Pouches closing', 306, n3(bal('pouch')));
  logCheck('Yield variance', '-6.0%', (r.yv * 100).toFixed(1) + '%');
  logCheck('Oil variance', '+5.0%', '+' + (r.lines.find(l => l.it === 'oil').v * 100).toFixed(1) + '%');
  logCheck('Invoice taxable ₹', 7500, inv1.tx / 100);
  logCheck('CGST ₹', 187.5, inv1.cg / 100);
  logCheck('SGST ₹', 187.5, inv1.sg / 100);
  logCheck('Invoice total ₹', 7875, inv1.tot / 100);
  logCheck('Retailer A outstanding ₹', 3875, out('A') / 100);

  S.benchResults = checks;
  S.benchCostPerPacket = cpp(r);
  saveState();
  toast('Benchmark successfully executed! All 9 audit checkpoints verified.', 'success');
  switchTab('bench');
}

function importDataJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const data = JSON.parse(evt.target.result);
      if (data && data.led && data.orders) {
        S = data;
        saveState();
        toast('Backup data imported successfully!', 'success');
        renderApp();
      } else {
        throw new Error('Invalid backup file structure');
      }
    } catch (err) {
      toast('Failed to restore backup: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

// CSV Export Helper
function exportTableToCSV(filename, headers, rows) {
  let csvContent = 'data:text/csv;charset=utf-8,';
  csvContent += headers.map(h => `"${h}"`).join(',') + '\r\n';
  rows.forEach(r => {
    csvContent += r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',') + '\r\n';
  });
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement('a');
  link.setAttribute('href', encodedUri);
  link.setAttribute('download', filename);
  document.body.appendChild(link);
  link.click();
  link.remove();
  toast(`Exported ${filename} successfully`, 'success');
}

function submitSalesOrderForm() {
  const cust = document.getElementById('soCustomer').value;

  try {

  }

function handleApproveOrder(oid) {
  try {
    const shortage = approveOrder(oid);
    if (shortage > 0) {
      toast(`Order #${oid} placed on hold. Finished goods short by ${shortage} pkts!`, 'warning');
    }
    renderApp();
  } catch (err) {
    toast(err.message, 'error');
  }
}

function handleInvoiceOrder(oid) {
  try {
    const inv = raiseInvoice(oid);
    renderApp();
    showInvoiceModal(inv.no);
  } catch (err) {
    toast(err.message, 'error');
  }
}

        const yieldFlag = Math.abs(r.yv) > TOL;
        return `
          <div style="border:1px solid var(--card-border);border-radius:8px;padding:14px;margin-bottom:12px;background:var(--surface-sub)">

              <div>

              <table>
                <thead>
                  <tr>

                    <th class="text-right">Variance (%)</th>
                    <th>Audit Status</th>
                  </tr>
                </thead>
                <tbody>
                  ${r.lines.map(l => `
                    <tr>
                      <td>${RAW_ITEMS[l.it]?.name || l.it}</td>
                      <td class="text-right">${n3(l.p)} ${RAW_ITEMS[l.it]?.unit || ''}</td>
                      <td class="text-right"><strong>${n3(l.a)}</strong> ${RAW_ITEMS[l.it]?.unit || ''}</td>
                      <td class="text-right" style="font-weight:600;color:${l.flag ? 'var(--danger)' : 'var(--tx-main)'}">
                        ${(l.v * 100 >= 0 ? '+' : '') + (l.v * 100).toFixed(1)}%
                      </td>
                      <td>
                        ${l.flag ? '<span class="badge badge-bad">⚑ Out of Tolerance (>3%)</span>' : '<span class="badge badge-ok">Within Tolerance</span>'}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-top:6px;border-top:1px solid var(--card-border)">
              <div>
                Materials: <strong>${inr(r.mat)}</strong> + Overheads: <strong>${inr(r.oh)}</strong>
                &nbsp;➔&nbsp; Total Cost: <strong>${inr(r.mat + r.oh)}</strong>
                &nbsp;➔&nbsp; <strong>₹${costPkt.toFixed(2)} / packet</strong>
                &nbsp;(Selling: ₹50.00 | Margin: <strong style="color:${marginPct < 0 ? 'var(--danger)' : 'var(--success)'}">${marginPct}%</strong>)
              </div>
              <div style="display:flex;gap:6px;align-items:center">

}

function submitPurchaseForm() {
  const it = document.getElementById('pItem').value;
  const vendor = document.getElementById('pVendor').value;
  const qty = +document.getElementById('pQty').value;
  const rate = +document.getElementById('pRate').value;
  try {
    purchaseItem(it, qty, rate, vendor);
    renderApp();
  } catch (err) {
    toast(err.message, 'error');
  }
}

function submitProductionRunForm() {
  const prod = S.products.mur;
  const issues = {};
  for (const it in prod.bom) {
    issues[it] = +document.getElementById('run_issue_' + it).value;
  }
  const good = +document.getElementById('run_good').value;
  try {
    runProduction('mur', issues, good);
    renderApp();
  } catch (err) {
    toast(err.message, 'error');
  }
}

function submitOverheadForm(runId) {
  const lbl = document.getElementById('oh_label_' + runId).value || 'Operating Overhead';
  const amt = +document.getElementById('oh_amount_' + runId).value;
  try {
    addOverhead(runId, lbl, amt);
    renderApp();
  } catch (err) {
    toast(err.message, 'error');
  }
}

function submitNewCustomer() {
  const id = document.getElementById('mCustId').value.trim();
  const name = document.getElementById('mCustName').value.trim();
  const state = document.getElementById('mCustState').value.trim();
  const stateCode = document.getElementById('mCustCode').value.trim();
  const gstin = document.getElementById('mCustGstin').value.trim();
  const city = document.getElementById('mCustCity').value.trim();
  const credit = +document.getElementById('mCustCredit').value;

  if (!id || !name) {
    alert('Please enter Customer ID and Name');
    return;
  }
  S.customers[id] = { id, name, state, stateCode, gstin: gstin || 'UNREGISTERED', city, creditLimit: credit * 100 };
  saveState();
  closeModal();
  toast(`Customer ${name} added successfully`, 'success');
  renderApp();
}

function submitNewProduct() {
  const id = document.getElementById('mProdId').value.trim();
  const name = document.getElementById('mProdName').value.trim();
  const hsn = document.getElementById('mProdHsn').value.trim() || '1905';
  const price = +document.getElementById('mProdPrice').value;
  const gstRate = +document.getElementById('mProdGst').value;
  const standardYield = +document.getElementById('mProdYield').value;

  const flour = +document.getElementById('mBomFlour').value;
  const oil = +document.getElementById('mBomOil').value;
  const spice = +document.getElementById('mBomSpice').value;

  if (!id || !name) {
    alert('Please enter Product ID and Name');
    return;
  }

  S.products[id] = {
    id,
    name,
    hsn,
    unit: 'packets',
    price: Math.round(price * 100),
    gstRate,
    standardYield,
    bom: { flour, oil, spice, pouch: standardYield, carton: Math.ceil(standardYield / 20) }
  };
  saveState();
  closeModal();
  toast(`Product ${name} created with standard recipe BOM!`, 'success');
  renderApp();
}

// Convert Number to Indian English Words for Invoices
function numberToWords(n) {
  const num = Math.round(n);
  if (num === 0) return 'Zero Rupees';
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
                'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

  function convertTwoDigits(v) {
    if (v < 20) return ones[v];
    return tens[Math.floor(v / 10)] + (v % 10 ? ' ' + ones[v % 10] : '');
  }

  function convertThreeDigits(v) {
    let str = '';
    if (Math.floor(v / 100) > 0) {
      str += ones[Math.floor(v / 100)] + ' Hundred ';
    }
    if (v % 100 > 0) {
      str += convertTwoDigits(v % 100);
    }
    return str.trim();
  }

  let crore = Math.floor(num / 10000000);
  let remainder = num % 10000000;
  let lakh = Math.floor(remainder / 100000);
  remainder = remainder % 100000;
  let thousand = Math.floor(remainder / 1000);
  remainder = remainder % 1000;

  let words = '';
  if (crore > 0) words += convertTwoDigits(crore) + ' Crore ';
  if (lakh > 0) words += convertTwoDigits(lakh) + ' Lakh ';
  if (thousand > 0) words += convertTwoDigits(thousand) + ' Thousand ';
  if (remainder > 0) words += convertThreeDigits(remainder);

  return 'Rupees ' + words.trim();
}

// Initialize Application
(function init() {
  const savedTheme = localStorage.getItem('o2a_theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  loadState();
  renderNav();
  renderApp();
})();
</script>
